name: CI

on:
  # Keep the required CI Passed check on docs-only PRs; filter expensive jobs below.
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Debug info bloats the target folder and slows linking; CI never reads it.
  CARGO_PROFILE_DEV_DEBUG: 0

concurrency:
  # A shared non-cancelling main group still drops all but one pending run.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # On pull_request the filter reads changed files via the API (no checkout);
      # on push it needs a local git history to diff against.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - "src/**"
              - "tests/**"
              - "index.html"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "tailwind.config.cjs"
              - "postcss.config.cjs"
              - "components.json"
              - "scripts/**"
              - ".github/workflows/**"
            backend:
              - "src-tauri/**"
              - "rust-toolchain.toml"
              - "scripts/backend-test-args*"
              - ".github/workflows/**"

  frontend:
    name: Frontend Checks (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    # Pushes to main always run everything: they keep the caches that PRs restore from warm.
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [checks, 1/3, 2/3, 3/3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        if: matrix.shard == 'checks'
        run: pnpm typecheck

      - name: Check formatting
        if: matrix.shard == 'checks'
        run: pnpm format:check

      - name: Unit tests
        if: matrix.shard != 'checks'
        run: pnpm test:unit --shard=${{ matrix.shard }}

      - name: Release workflow tests
        if: matrix.shard == 'checks'
        run: node --test scripts/*.test.mjs

      - name: Build frontend
        if: matrix.shard == 'checks'
        run: pnpm build:renderer

  backend:
    name: Backend Checks (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            suite: all
          - os: macos-latest
            suite: unit
          - os: macos-latest
            suite: integration
          - os: windows-latest
            suite: unit
          - os: windows-latest
            suite: 1/3
          - os: windows-latest
            suite: 2/3
          - os: windows-latest
            suite: 3/3
    steps:
      # Runners are disposable; real-time scanning only slows the file-heavy tests.
      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ runner.os == 'Linux' && 'rustfmt, clippy' || '' }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      # A PR-scoped cache is unreadable by other PRs and evicts main's under the 10 GB limit.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: backend
          save-if: ${{ github.event_name == 'push' && (matrix.suite == 'all' || matrix.suite == 'unit') }}

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      # Lint is platform-independent; only tests need every OS.
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Select test targets
        id: targets
        shell: bash
        run: echo "args=$(node scripts/backend-test-args.mjs '${{ matrix.suite }}')" >> "$GITHUB_OUTPUT"

      - name: Run tests
        shell: bash
        env:
          TEST_ARGS: ${{ steps.targets.outputs.args }}
        run: |
          read -ra args <<< "$TEST_ARGS"
          cargo test --locked --manifest-path src-tauri/Cargo.toml "${args[@]}"

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, frontend, backend]
    steps:
      - uses: actions/checkout@v6
      - name: Verify required checks
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-ci.mjs
